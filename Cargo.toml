[package]
name = "reel-studio-gpui"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
# The local hour for the home greeting (std has no time zones).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cosmic-text = "0.14"
cpal = "0.18.2"
ffmpeg-next = "9"
# gpui's defaults minus `windows-manifest`: build.rs embeds our own manifest
# (a superset of gpui's), and two RT_MANIFEST #1 resources fail the link
# (CVT1100 duplicate resource).
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
image = "0.25"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tiny-skia = "0.11"
# The system languages (Settings → Language: "Same as device").
sys-locale = "0.3"
ttf-parser = "0.25"
ureq = "3"
# The preview's portable GPU renderer (src/effects/portable.rs): always off
# macOS, on macOS only with the `wgpu-effects` feature (to test it there).
wgpu = { version = "25", optional = true, default-features = false, features = ["glsl", "metal"] }
pollster = { version = "0.4", optional = true }
# Face swap inference (src/face_swap/): ONNX Runtime. On Apple silicon and
# Windows its prebuilt library is fetched at build time and linked in; on
# Linux and Intel Macs it's loaded at run time from the copy the release
# ships (below; build.rs sets `ort_dynamic` for exactly those targets). The
# models are never bundled (<data>/models/face-swap). `half`: fp16 model
# inputs. The API level (`api-NN`, the oldest ONNX Runtime 1.NN it works
# with) and GPU providers per platform below.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "half"] }
half = "2"

# Free disk space for Settings → Storage Usage (statvfs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The effect / filter passes of the preview (gpui already links both).
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"
# The trackpad pinch monitor (src/pinch.rs): an AppKit event block.
block = "0.1"
# The AI agent's API keys, kept in the login keychain.
security-framework = "3"
# Face swap on the GPU / Neural Engine (falls back to the CPU per op).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["coreml"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-31", "download-binaries", "copy-dylibs", "tls-native"] }

# Intel Macs: ort has no prebuilt library for them, and Microsoft's last
# Intel build is 1.23.2, so the app bundles that one
# (packaging/macos/fetch-onnxruntime.sh) and loads it at run time.
[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-23", "load-dynamic"] }

# Face swap on any DirectX 12 GPU.
[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-31", "directml", "download-binaries", "copy-dylibs", "tls-native"] }

# Face swap on Linux loads ONNX Runtime when it starts
# (src/face_swap/runtime.rs): the library ort would link was built on a
# newer glibc (2.38+) than the release supports (Ubuntu 22.04's 2.35), so
# the release ships Microsoft's own build next to the program
# (packaging/linux/fetch-onnxruntime.sh).
[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-31", "load-dynamic"] }

# Off macOS the preview draws on wgpu: Vulkan (Linux), DX12 or Vulkan (Windows).
[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "25", default-features = false, features = ["glsl", "vulkan", "dx12"] }
pollster = "0.4"

[build-dependencies]
cc = "1.11.1"

# The Windows resources (manifest, icon, version) of reel-studio.exe.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[features]
# Link the shared C++ engine core from the main repo (REEL_ENGINE_DIR); without
# a checkout it falls back to the Rust stand-in (REEL_REQUIRE_ENGINE=1: error).
cpp-engine = []
# Build the portable (wgpu) preview renderer on macOS too, and run its
# tests there: `cargo test --features wgpu-effects`. The app still draws
# with Metal on macOS.
wgpu-effects = ["dep:wgpu", "dep:pollster"]
# Face swap on NVIDIA GPUs (needs the CUDA 12 + cuDNN 9 runtime installed;
# on Linux also a CUDA build of ONNX Runtime, through ORT_DYLIB_PATH).
cuda = ["ort/cuda"]

# Keep target/debug small: line numbers for our crate, no debug info for
# dependencies (full symbols for GPUI's tree cost >10 GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
