[package]
name = "reel-studio-gpui"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
cosmic-text = "0.14"
cpal = "0.18.2"
ffmpeg-next = "9"
gpui = "0.2.2"
image = "0.25"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tiny-skia = "0.11"
ttf-parser = "0.25"
ureq = "3"

# The effect / filter passes of the preview (gpui already links both).
[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.29"
objc = "0.2"
# The AI agent's API keys, kept in the login keychain.
security-framework = "3"

[build-dependencies]
cc = "1.11.1"

[features]
# Link the shared C++ engine core from the main repo (needs REEL_ENGINE_DIR).
cpp-engine = []
