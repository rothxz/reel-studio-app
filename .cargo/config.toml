# Local defaults for the workspace layout (~/Project/reel-studio-app next to
# ~/Project/reel-studio). An exported REEL_ENGINE_DIR / REEL_APP_DIR still wins.
[env]
REEL_ENGINE_DIR = { value = "../reel-studio/modules/video-engine/cpp", relative = true, force = false }
# The app checkout: public client config (.env) and the filter catalog,
# compiled in by build.rs, never copied into this repo.
REEL_APP_DIR = { value = "../reel-studio", relative = true, force = false }

[alias]
# The app as it should be developed: on the shared C++ engine.
dev = "run --release --features cpp-engine --"
t = "test --features cpp-engine"
