# Release of the native app: every push to `release` (a merged PR, usually
# main → release, as the old desktop build releases from its own branch)
# builds it for macOS (Apple silicon + Intel), Linux (x64 + arm64) and
# Windows (x64) and publishes a GitHub Release `v<version>` in this
# repo, the feed src/updater.rs reads:
#
#   Reel-Studio-<version>-mac-<arm64|x64>.zip        installed by the in-app updater
#   Reel-Studio-<version>-mac-<arm64|x64>.dmg        for downloading by hand
#   Reel-Studio-<version>-linux-<x64|arm64>.AppImage runs as it is; the updater's
#   Reel-Studio-<version>-linux-<x64|arm64>.tar.gz   to install by hand
#   Reel-Studio-<version>-windows-x64.zip            portable; the updater's
#   Reel-Studio-<version>-windows-x64-setup.exe      the installer
#   update.json                                      version + per-platform url / SHA-256 / size
#
# plus the hand downloads again under names without the version
# (Reel-Studio-mac-arm64.dmg, …-windows-x64-setup.exe, …-linux-x64.AppImage),
# so the README links `releases/latest/download/<name>` always fetch the
# newest. Each release is marked "Latest" (set PRERELEASE below to hold a
# release back as a pre-release instead).
#
# Version = Cargo.toml's major.minor + this workflow's run number
# (0.2.0 → 0.2.57), so every merge is a new release without a bump commit.
# Bump major/minor in Cargo.toml by hand.
#
# Secrets:
#   REEL_STUDIO_TOKEN   required. Fine-grained token, Contents: read on the
#                       private app repo (rothxz/reel-studio): the engine
#                       sources and the filter catalog are compiled in from
#                       it, never committed here.
#   REEL_ASSETS_URL, REEL_CATALOG_URL, REEL_CATALOG_KEY
#                       required. The app's public client config (asset
#                       host, catalog database URL + publishable key); the
#                       same values as the app's EXPO_PUBLIC_ASSETS_URL /
#                       EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_KEY.
#   REEL_POSTHOG_KEY, REEL_POSTHOG_HOST
#                       optional. The phone app's PostHog project (its
#                       EXPO_PUBLIC_POSTHOG_API_KEY / _HOST): anonymous usage
#                       events, src/analytics.rs. Unset = no analytics.
#   MAC_CSC_LINK (base64 .p12, Developer ID Application), MAC_CSC_KEY_PASSWORD
#                       sign; APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
#                       APPLE_TEAM_ID notarize. Optional: without them the
#                       apps are ad-hoc signed (they run and update, but
#                       Gatekeeper asks on first open).
#   WIN_SIGN_PFX (base64 .pfx, code signing), WIN_SIGN_PASSWORD
#                       sign the Windows program and installer. Optional:
#                       unsigned, SmartScreen warns on first run.
#
# Keep the secrets in the `release` environment (Settings → Environments →
# release: deployment branches = `release` only), not as repo secrets: only
# this workflow on the `release` branch can read them then, never a
# workflow edited on another branch.
#
# This repo is public, and so are its Actions logs and caches' reach:
# - the build step keeps compiler output about the private engine sources
#   out of the log;
# - nothing built from the private sources is cached (pull requests aimed
#   at `release` could restore a cache saved here);
# - each secret is given only to the step that needs it (cargo, whose
#   build scripts are third-party code, gets the public client config
#   and no credential);
# - actions are pinned to commits, not tags that could be moved.
name: Release

on:
  push:
    branches: [release]
  # A manual run (Actions → Release → Run workflow, on any branch) is a
  # test build by default: the same downloads as a release, kept as the
  # run's artifacts (7 days) to try in VMs, nothing published. It runs in
  # the `release-test` environment: give that environment the same
  # REEL_* secrets (deployment branches: any) to build on the C++ engine;
  # without them the test build uses the Rust stand-in, with a warning.
  # Tick "publish" on the `release` branch to publish as a push does.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (release branch, all platforms only)
        type: boolean
        default: false
      platforms:
        description: Platforms to build
        type: choice
        default: all
        options: [all, windows, linux, macos]

concurrency:
  # Releases queue one after another; a test build only replaces an
  # earlier test build of the same branch.
  group: ${{ github.event_name == 'push' && 'release' || format('release-test-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' && !inputs.publish }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  PRERELEASE: "false"
  # true: a release (push to `release`, or a manual run with publish);
  # false: a test build.
  PUBLISH: ${{ (github.event_name == 'push' || inputs.publish) && 'true' || 'false' }}
  # Which environment holds the secrets (see `workflow_dispatch` above).
  SECRETS_ENV: ${{ (github.event_name == 'push' || inputs.publish) && 'release' || 'release-test' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the run
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          if [ "$GITHUB_REF_NAME" != release ] || [ "${{ inputs.platforms }}" != all ]; then
            echo "::error::Publish only from the release branch with all platforms (this run: ${GITHUB_REF_NAME}, ${{ inputs.platforms }})"
            exit 1
          fi
      - id: version
        run: |
          base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          version="$(echo "$base" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  build:
    name: macOS (${{ matrix.arch }})
    needs: version
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'macos'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          # Cross-built on the Apple silicon runner.
          - arch: x64
            target: x86_64-apple-darwin
    runs-on: macos-latest
    environment: ${{ (github.event_name == 'push' || inputs.publish) && 'release' || 'release-test' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FFMPEG_DIR: ${{ github.workspace }}/.ffmpeg/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check secrets
        id: secrets
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          REEL_STUDIO_TOKEN: ${{ secrets.REEL_STUDIO_TOKEN }}
          REEL_ASSETS_URL: ${{ secrets.REEL_ASSETS_URL }}
          REEL_CATALOG_URL: ${{ secrets.REEL_CATALOG_URL }}
          REEL_CATALOG_KEY: ${{ secrets.REEL_CATALOG_KEY }}
        run: |
          missing=()
          for s in REEL_STUDIO_TOKEN REEL_ASSETS_URL REEL_CATALOG_URL REEL_CATALOG_KEY; do
            [ -n "${!s}" ] || missing+=("$s")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            if [ "$PUBLISH" = true ]; then
              # Without them the app ships with no engine, effects, filters or library.
              echo "::error::Set the secrets ($SECRETS_ENV environment): ${missing[*]}"
              exit 1
            fi
            echo "::warning::Test build without ${missing[*]} ($SECRETS_ENV environment): the Rust stand-in instead of the C++ engine without REEL_STUDIO_TOKEN; no effects, filters or library without the REEL_* config"
          fi
          if [ -n "$REEL_STUDIO_TOKEN" ]; then echo "engine=true" >> "$GITHUB_OUTPUT"; fi
          # Signing is optional; later steps only learn whether it's set.
          if [ -n "$MAC_CSC_LINK" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; fi

      # Only the folders build.rs reads: the engine core and the filter data.
      - name: Check out the engine (private)
        if: steps.secrets.outputs.engine == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rothxz/reel-studio
          token: ${{ secrets.REEL_STUDIO_TOKEN }}
          path: reel-studio
          sparse-checkout: |
            modules/video-engine/cpp
            src/data
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      # Newer Xcodes ship the Metal compiler (gpui's shaders) separately.
      - name: Metal toolchain
        run: xcrun -f metal > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-${{ matrix.arch }}-${{ env.MACOSX_DEPLOYMENT_TARGET }}-${{ hashFiles('packaging/macos/build-ffmpeg.sh') }}

      - name: Build FFmpeg (static, LGPL)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: |
          [ "${{ matrix.arch }}" = x64 ] && brew install nasm
          packaging/macos/build-ffmpeg.sh "${{ matrix.arch }}" "$FFMPEG_DIR"

      - name: Build
        env:
          REEL_VERSION: ${{ env.VERSION }}
          REEL_ENGINE_DIR: ${{ github.workspace }}/reel-studio/modules/video-engine/cpp
          REEL_APP_DIR: ${{ github.workspace }}/reel-studio
          REEL_ASSETS_URL: ${{ secrets.REEL_ASSETS_URL }}
          REEL_CATALOG_URL: ${{ secrets.REEL_CATALOG_URL }}
          REEL_CATALOG_KEY: ${{ secrets.REEL_CATALOG_KEY }}
          REEL_POSTHOG_KEY: ${{ secrets.REEL_POSTHOG_KEY }}
          REEL_POSTHOG_HOST: ${{ secrets.REEL_POSTHOG_HOST }}
        run: |
          log="$RUNNER_TEMP/build.log"
          if cargo build --release --locked ${{ steps.secrets.outputs.engine == 'true' && '--features cpp-engine' || '' }} --target "${{ matrix.target }}" > "$log" 2>&1; then
            tail -n 3 "$log"
            exit 0
          fi
          if grep -q 'failed to run custom build command for `reel-studio-gpui' "$log"; then
            # The engine (C++) failed: its compiler output quotes private
            # sources, so only the error lines go to this public log.
            echo "::error::The engine failed to build; compiler output withheld (public log). Errors:"
            grep -E ': (fatal )?error:' "$log" | sed -E 's#^.*/(modules/video-engine/cpp/)#\1#' | head -n 40
          else
            cat "$log"
          fi
          exit 1

      - name: Import signing certificate
        if: steps.secrets.outputs.sign == 'true'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')
          if [ -z "$identity" ]; then
            echo "::error::MAC_CSC_LINK has no Developer ID Application identity"
            exit 1
          fi
          echo "MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Bundle, sign, notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          packaging/macos/bundle.sh "target/${{ matrix.target }}/release/reel-studio-gpui" \
            "$VERSION" "${{ matrix.arch }}" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux (${{ matrix.arch }})
    needs: version
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'linux'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # The oldest glibc the app supports is the one it's built on.
    runs-on: ${{ matrix.runner }}
    environment: ${{ (github.event_name == 'push' || inputs.publish) && 'release' || 'release-test' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FFMPEG_DIR: ${{ github.workspace }}/.ffmpeg/linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check secrets
        id: secrets
        env:
          REEL_STUDIO_TOKEN: ${{ secrets.REEL_STUDIO_TOKEN }}
          REEL_ASSETS_URL: ${{ secrets.REEL_ASSETS_URL }}
          REEL_CATALOG_URL: ${{ secrets.REEL_CATALOG_URL }}
          REEL_CATALOG_KEY: ${{ secrets.REEL_CATALOG_KEY }}
        run: |
          missing=()
          for s in REEL_STUDIO_TOKEN REEL_ASSETS_URL REEL_CATALOG_URL REEL_CATALOG_KEY; do
            [ -n "${!s}" ] || missing+=("$s")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            if [ "$PUBLISH" = true ]; then
              # Without them the app ships with no engine, effects, filters or library.
              echo "::error::Set the secrets ($SECRETS_ENV environment): ${missing[*]}"
              exit 1
            fi
            echo "::warning::Test build without ${missing[*]} ($SECRETS_ENV environment): the Rust stand-in instead of the C++ engine without REEL_STUDIO_TOKEN; no effects, filters or library without the REEL_* config"
          fi
          if [ -n "$REEL_STUDIO_TOKEN" ]; then echo "engine=true" >> "$GITHUB_OUTPUT"; fi

      # Only the folders build.rs reads: the engine core and the filter data.
      - name: Check out the engine (private)
        if: steps.secrets.outputs.engine == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rothxz/reel-studio
          token: ${{ secrets.REEL_STUDIO_TOKEN }}
          path: reel-studio
          sparse-checkout: |
            modules/video-engine/cpp
            src/data
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm pkg-config clang zlib1g-dev libbz2-dev \
            libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev file

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-linux-${{ matrix.arch }}-${{ matrix.runner }}-${{ hashFiles('packaging/linux/build-ffmpeg.sh') }}

      - name: Build FFmpeg (static, LGPL)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: packaging/linux/build-ffmpeg.sh "$FFMPEG_DIR"

      - name: Build
        env:
          REEL_VERSION: ${{ env.VERSION }}
          REEL_ENGINE_DIR: ${{ github.workspace }}/reel-studio/modules/video-engine/cpp
          REEL_APP_DIR: ${{ github.workspace }}/reel-studio
          REEL_ASSETS_URL: ${{ secrets.REEL_ASSETS_URL }}
          REEL_CATALOG_URL: ${{ secrets.REEL_CATALOG_URL }}
          REEL_CATALOG_KEY: ${{ secrets.REEL_CATALOG_KEY }}
          REEL_POSTHOG_KEY: ${{ secrets.REEL_POSTHOG_KEY }}
          REEL_POSTHOG_HOST: ${{ secrets.REEL_POSTHOG_HOST }}
        run: |
          log="$RUNNER_TEMP/build.log"
          if cargo build --release --locked ${{ steps.secrets.outputs.engine == 'true' && '--features cpp-engine' || '' }} > "$log" 2>&1; then
            tail -n 3 "$log"
            exit 0
          fi
          if grep -q 'failed to run custom build command for `reel-studio-gpui' "$log"; then
            # The engine (C++) failed: its compiler output quotes private
            # sources, so only the error lines go to this public log.
            echo "::error::The engine failed to build; compiler output withheld (public log). Errors:"
            grep -E ': (fatal )?error:' "$log" | sed -E 's#^.*/(modules/video-engine/cpp/)#\1#' | head -n 40
          else
            cat "$log"
          fi
          exit 1

      - name: AppImage, tar.gz
        env:
          # The API fallback for the pinned AppImage tools (rate limit).
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          packaging/linux/bundle.sh target/release/reel-studio-gpui \
            "$VERSION" "${{ matrix.arch }}" dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows (x64)
    needs: version
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-2022
    environment: ${{ (github.event_name == 'push' || inputs.publish) && 'release' || 'release-test' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FFMPEG_DIR: ${{ github.workspace }}\.ffmpeg\windows-x64
      # bindgen (FFmpeg's bindings) finds libclang here.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check secrets
        id: secrets
        env:
          REEL_STUDIO_TOKEN: ${{ secrets.REEL_STUDIO_TOKEN }}
          REEL_ASSETS_URL: ${{ secrets.REEL_ASSETS_URL }}
          REEL_CATALOG_URL: ${{ secrets.REEL_CATALOG_URL }}
          REEL_CATALOG_KEY: ${{ secrets.REEL_CATALOG_KEY }}
          WIN_SIGN_PFX: ${{ secrets.WIN_SIGN_PFX }}
        run: |
          missing=()
          for s in REEL_STUDIO_TOKEN REEL_ASSETS_URL REEL_CATALOG_URL REEL_CATALOG_KEY; do
            [ -n "${!s}" ] || missing+=("$s")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            if [ "$PUBLISH" = true ]; then
              # Without them the app ships with no engine, effects, filters or library.
              echo "::error::Set the secrets ($SECRETS_ENV environment): ${missing[*]}"
              exit 1
            fi
            echo "::warning::Test build without ${missing[*]} ($SECRETS_ENV environment): the Rust stand-in instead of the C++ engine without REEL_STUDIO_TOKEN; no effects, filters or library without the REEL_* config"
          fi
          if [ -n "$REEL_STUDIO_TOKEN" ]; then echo "engine=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$WIN_SIGN_PFX" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check out the engine (private)
        if: steps.secrets.outputs.engine == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rothxz/reel-studio
          token: ${{ secrets.REEL_STUDIO_TOKEN }}
          path: reel-studio
          sparse-checkout: |
            modules/video-engine/cpp
            src/data
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # cl / link / lib / rc / dumpbin for FFmpeg, the engine and packaging.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ffmpeg-windows-x64-msvc-${{ hashFiles('packaging/windows/build-ffmpeg.sh') }}

      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        with:
          msystem: MSYS
          path-type: inherit
          update: false
          install: make diffutils nasm

      - name: Build FFmpeg (static, LGPL, MSVC)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          # MSYS2's link.exe (coreutils) would shadow MSVC's.
          mv /usr/bin/link.exe /usr/bin/link.exe.msys
          packaging/windows/build-ffmpeg.sh "$(cygpath -u "$FFMPEG_DIR")"

      - name: Build
        env:
          REEL_VERSION: ${{ env.VERSION }}
          REEL_ENGINE_DIR: ${{ github.workspace }}/reel-studio/modules/video-engine/cpp
          REEL_APP_DIR: ${{ github.workspace }}/reel-studio
          REEL_ASSETS_URL: ${{ secrets.REEL_ASSETS_URL }}
          REEL_CATALOG_URL: ${{ secrets.REEL_CATALOG_URL }}
          REEL_CATALOG_KEY: ${{ secrets.REEL_CATALOG_KEY }}
          REEL_POSTHOG_KEY: ${{ secrets.REEL_POSTHOG_KEY }}
          REEL_POSTHOG_HOST: ${{ secrets.REEL_POSTHOG_HOST }}
        run: |
          # Git Bash puts its coreutils `link` (hard links) ahead of MSVC's
          # on PATH; point rustc at the one next to cl.exe.
          msvc_link="$(dirname "$(command -v cl.exe)")/link.exe"
          [ -f "$msvc_link" ] || { echo "::error::MSVC link.exe not found next to cl.exe"; exit 1; }
          export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="$(cygpath -w "$msvc_link")"
          echo "Linker: $CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER"
          log="$RUNNER_TEMP/build.log"
          if cargo build --release --locked ${{ steps.secrets.outputs.engine == 'true' && '--features cpp-engine' || '' }} > "$log" 2>&1; then
            tail -n 3 "$log"
            exit 0
          fi
          if grep -q 'failed to run custom build command for `reel-studio-gpui' "$log"; then
            # The engine (C++) failed: its compiler output quotes private
            # sources, so only the error lines go to this public log.
            echo "::error::The engine failed to build; compiler output withheld (public log). Errors:"
            grep -E '(: (fatal )?error)|(error C[0-9]+)' "$log" \
              | sed -E 's#^.*[/\\](modules[/\\]video-engine[/\\]cpp[/\\])#\1#' | head -n 40
          else
            cat "$log"
          fi
          exit 1

      - name: Zip, installer
        shell: pwsh
        env:
          WIN_SIGN_PFX: ${{ secrets.WIN_SIGN_PFX }}
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
        run: |
          packaging/windows/bundle.ps1 -Binary target/release/reel-studio-gpui.exe `
            -Version $env:VERSION -Arch x64 -Out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [version, build, linux, windows]
    # Test builds stop at the artifacts.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: v${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history and tags: the notes list the commits since
          # the last native release.
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      # What's new: the release body, which the app's update dialog shows.
      - name: Release notes
        run: |
          # The previous release: `v…`, or `native-v…` before 0.2.12.
          prev=$(git tag -l 'v*' 'native-v*' --merged "$GITHUB_SHA" \
            --sort=-creatordate | grep -vx -e "$TAG" -e "native-$TAG" | head -n1)
          # One line per commit, its "feat(scope):" prefix dropped and the
          # first letter capitalised.
          tidy() { sed -E 's/^- [a-z]+(\([^)]*\))?!?: /- /; s/^- (.)/- \U\1/'; }
          {
            echo "## What's new"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty='- %s' "$prev..$GITHUB_SHA" | tidy
            else
              git log --no-merges --pretty='- %s' -n 30 "$GITHUB_SHA" | tidy
            fi
            echo
            echo "Built from ${GITHUB_SHA::7} on \`${GITHUB_REF_NAME}\`."
          } > out/notes.md
          cat out/notes.md

      # What each platform's updater installs: the zips (macOS, Windows)
      # and the AppImages.
      - name: update.json
        run: |
          packaging/update-manifest.sh "$VERSION" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG" \
            out/*.zip out/*.AppImage > out/update.json
          cat out/update.json

      # The manifest goes up last: the updater only sees a release once its
      # update.json is there, so it never finds a half-uploaded one.
      - name: Publish ${{ env.TAG }}
        run: |
          # The README's download links: the same files without the version.
          for f in out/*.dmg out/*-setup.exe out/*.AppImage; do
            cp "$f" "out/$(basename "$f" | sed "s/^Reel-Studio-$VERSION-/Reel-Studio-/")"
          done
          ls -la out
          files=(out/*.zip out/*.dmg out/*.AppImage out/*.tar.gz out/*-setup.exe)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A re-run keeps its run number, so the release already exists.
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release upload "$TAG" out/update.json --clobber
            gh release edit "$TAG" --notes-file out/notes.md
          else
            flags=(--latest)
            [ "$PRERELEASE" = true ] && flags=(--latest=false --prerelease)
            gh release create "$TAG" "${files[@]}" --draft "${flags[@]}" \
              --target "$GITHUB_SHA" \
              --title "Reel Studio $VERSION" \
              --notes-file out/notes.md
            gh release upload "$TAG" out/update.json
            gh release edit "$TAG" --draft=false "${flags[@]}"
          fi

      # Installs up to 0.2.11 only look for `native-v…` releases. Give them
      # one per version, a pre-release holding just the same update.json:
      # its links point at the files of the `v…` release above, so those
      # installs update onto a build that reads `v…` tags itself. Drop this
      # step once nobody runs 0.2.11 or older.
      - name: Publish native-${{ env.TAG }} (for older installs)
        run: |
          bridge="native-$TAG"
          if gh release view "$bridge" > /dev/null 2>&1; then
            gh release upload "$bridge" out/update.json --clobber
            gh release edit "$bridge" --notes-file out/notes.md
          else
            gh release create "$bridge" --latest=false --prerelease \
              --target "$GITHUB_SHA" \
              --title "Reel Studio $VERSION (update for 0.2.11 and older)" \
              --notes-file out/notes.md
            gh release upload "$bridge" out/update.json
          fi
